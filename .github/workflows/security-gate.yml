name: security-gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  security-gate:
    name: security-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Lightweight secret pattern scan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          fail=0
          patterns=(
            'ghp_[A-Za-z0-9]{36}'
            'github_pat_[A-Za-z0-9_]{80,}'
            'AKIA[0-9A-Z]{16}'
            'AIza[0-9A-Za-z\-_]{35}'
            'xox[baprs]-[0-9A-Za-z\-]{10,}'
            '-----BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY-----'
          )

          if [[ "$EVENT_NAME" == "pull_request" ]] && [[ -n "$BASE_REF" ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            mapfile -t candidate_files < <(git diff --name-only --diff-filter=ACMR "origin/$BASE_REF...HEAD")
          else
            mapfile -t candidate_files < <(git ls-files)
          fi

          scan_files=()
          for f in "${candidate_files[@]}"; do
            case "$f" in
              *.md|*.txt)
                continue
                ;;
              *)
                scan_files+=("$f")
                ;;
            esac
          done

          if [ "${#scan_files[@]}" -eq 0 ]; then
            echo "No candidate files to secret-scan for this event."
            exit 0
          fi

          for p in "${patterns[@]}"; do
            if git grep -nI -E "$p" -- "${scan_files[@]}" >/tmp/secret_matches.txt 2>/dev/null; then
              echo "Potential secret pattern found for regex: $p"
              cat /tmp/secret_matches.txt
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            echo "Potential secrets detected."
            exit 1
          fi

          echo "No high-signal secret patterns detected."

      - name: Setup Node.js (if needed)
        if: ${{ hashFiles('**/package.json') != '' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: NPM audit (if package-lock exists)
        if: ${{ hashFiles('**/package-lock.json') != '' }}
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          lock_dirs=()
          missing_locks=0

          if [[ "$EVENT_NAME" == "pull_request" ]] && [[ -n "$BASE_REF" ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            changed_manifests=()
            while IFS= read -r manifest; do
              changed_manifests+=("$manifest")
            done < <(
              git diff --name-only "origin/$BASE_REF...HEAD" |
                grep -E '(^|/)package(-lock)?\.json$' || true
            )

            if [ "${#changed_manifests[@]}" -eq 0 ]; then
              echo "Dependency manifests were not changed in this PR; skipping enforced npm audit."
              exit 0
            fi

            for manifest in "${changed_manifests[@]}"; do
              package_dir="$(dirname "$manifest")"

              if [ -f "$package_dir/package-lock.json" ]; then
                lock_dirs+=("$package_dir")
              elif [ -f "$package_dir/package.json" ]; then
                case "$manifest" in
                  */package-lock.json|package-lock.json)
                    echo "::error::Removed package-lock.json while package.json remains: $manifest"
                    ;;
                  *)
                    echo "::error::Changed package.json has no sibling package-lock.json: $manifest"
                    ;;
                esac
                missing_locks=1
              elif [ -d "$package_dir" ]; then
                echo "Changed dependency manifest was removed; no remaining package.json to audit: $manifest"
              else
                echo "Changed dependency manifest was removed; no remaining package directory to audit: $manifest"
              fi
            done
          else
            while IFS= read -r lockfile; do
              package_dir="$(dirname "$lockfile")"
              lock_dirs+=("$package_dir")
            done < <(find . -name package-lock.json -not -path '*/node_modules/*' -print | sort)
          fi

          if [ "$missing_locks" -ne 0 ]; then
            exit 1
          fi

          if [ "${#lock_dirs[@]}" -eq 0 ]; then
            echo "No package-lock.json files matched this event; skipping enforced npm audit."
            exit 0
          fi

          unique_lock_dirs=()
          while IFS= read -r package_dir; do
            unique_lock_dirs+=("$package_dir")
          done < <(printf '%s\n' "${lock_dirs[@]}" | sort -u)

          audit_failed=0
          for package_dir in "${unique_lock_dirs[@]}"; do
            echo "Running npm audit in $package_dir"
            if ! (
              cd "$package_dir"
              npm ci --ignore-scripts
              npm audit --audit-level=high
            ); then
              echo "::error::npm audit failed in $package_dir"
              audit_failed=1
            fi
          done

          exit "$audit_failed"
